<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product details</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Bricolage+Grotesque:wght;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>">
</head>
<body>

  <header>
    <div class="header-inner">
      <h1 data-shop="name">ChromaCraft Studio &amp; labs</h1>
      <nav>
        <a href="index.html">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3 2 12h3v8h6v-5h2v5h6v-8h3z"/></svg>
          <span>Home</span>
        </a>
        <a href="cart.html">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M7 4h-1.5l-.9 2H2v2h1.5l3.3 7.59-1.24 2.25c-.15.26-.23.56-.23.87A2 2 0 0 0 7.3 20.7H19v-2H7.42a.25.25 0 0 1-.22-.37l.9-1.63h7.45a2 2 0 0 0 1.75-1.03l3.24-5.88A1 1 0 0 0 19.66 8H6.2l-.94-2H7zM7 22a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm10 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg>
          <span>Cart (<span id="cartCount">0</span>)</span>
        </a>
        <a href="account.html">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4.4 0-9 2.2-9 5v3h18v-3c0-2.8-4.6-5-9-5z"/></svg>
          <span>Account</span>
        </a>
      </nav>
    </div>
  </header>

  <main>
    <p><a href="index.html">&larr; Back to all products</a></p>
        <div id="detailBox">Loading...</div>

    <div id="reviewsSection">
      <h3>Customer reviews</h3>
      <div id="reviewSummary">Loading reviews...</div>
      <div id="reviewList"></div>

      <h3>Write a review</h3>
      <input id="revName" placeholder="Your name">
      <select id="revRating">
        <option value="5">&#9733;&#9733;&#9733;&#9733;&#9733; Excellent</option>
        <option value="4">&#9733;&#9733;&#9733;&#9733;&#9734; Good</option>
        <option value="3">&#9733;&#9733;&#9733;&#9734;&#9734; Okay</option>
        <option value="2">&#9733;&#9733;&#9734;&#9734;&#9734; Not great</option>
        <option value="1">&#9733;&#9734;&#9734;&#9734;&#9734; Poor</option>
      </select>
      <textarea id="revComment" rows="3" maxlength="500" placeholder="Share your experience with this product..."></textarea>
      <button id="submitReviewBtn">Submit review</button>
      <p id="reviewMsg"></p>
    </div>
  </main>

  <div id="stickyBar" style="display:none">
    <span id="stickyInfo"></span>
    <a id="stickyBtn" class="customize-btn" href="#">Customize now</a>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/product-detail.js"></script>
</body>
</html>
